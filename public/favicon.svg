<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="rounded">
      <circle cx="64" cy="64" r="64"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Deep blue base -->
    <rect width="128" height="128" fill="#0c0f41"/>

    <!-- Orange diagonal (top-left triangle) -->
    <polygon points="0,0 128,0 0,128" fill="#FF6B35"/>

    <!-- White 'a' -->
    <text x="7" y="105"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
          font-size="150" font-weight="700"
          fill="#FFFFFF">a</text>

    <!-- Purple dot -->
    <text x="87" y="107"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
          font-size="150" font-weight="700"
          fill="#9B69FF">.</text>
  </g>
</svg>
