        <h1>Aito.ai Predictive Database Demo</h1>
        <p>This interactive demo showcases Aito.ai's predictive database through an intelligent grocery store application with 11 production-ready ML features.</p>

        <h2>Featured ML Capabilities</h2>
        <ul>
          <li><strong>Personalized Search</strong> — Query-based ranking with user context and purchase probability</li>
          <li><strong>Smart Recommendations</strong> — Goal-oriented product suggestions using the _recommend endpoint</li>
          <li><strong>Invoice Automation</strong> — Automatic GL code assignment and approval routing</li>
          <li><strong>Price-Demand Analytics</strong> — Data-driven pricing optimization and demand forecasting</li>
          <li><strong>Product Catalog AI</strong> — Category and price prediction for new products</li>
          <li><strong>NLP Support</strong> — Customer inquiry classification and sentiment analysis</li>
          <li><strong>Statistical Discovery</strong> — Correlation analysis with the _relate endpoint</li>
          <li><strong>Model Quality Monitoring</strong> — Real-time evaluation and performance metrics</li>
          <li><strong>AI Shopping Assistant</strong> — Contextual chatbot with cart management</li>
          <li><strong>Employee Assistant</strong> — Internal business intelligence chatbot</li>
          <li><strong>Predictive Autofill</strong> — Smart cart pre-filling based on user patterns</li>
        </ul>

        <h2>Technical Highlights</h2>
        <p>Query-based inference without model training or MLOps infrastructure. 20-50ms API response times. SQL-like queries return ML predictions instead of raw data.</p>

        <p>Please <a href="https://aito.ai">visit aito.ai</a> for more information, or enable JavaScript to experience the interactive demo.</p>
